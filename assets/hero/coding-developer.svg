<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" width="1400" height="380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Gunabhiram Aruru — Software Engineer. Applied AI, Backend Systems, Agent Workflows.</title>
  <desc id="heroDesc">A dark banner. On the left, the name Gunabhiram Aruru above the role Software Engineer and the line Applied AI, Backend Systems, Agent Workflows. On the right, a night-time workspace seen from behind: a developer sits at a desk in front of a glowing monitor showing lines of code with a blinking cursor, with a closed laptop, a lit desk lamp and a steaming cup of coffee on the desk.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f16"/>
      <stop offset="0.5" stop-color="#0d131c"/>
      <stop offset="1" stop-color="#0a1119"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#f5a524" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lampCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1a26"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232c37"/>
      <stop offset="1" stop-color="#151c25"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18202b"/>
      <stop offset="0.62" stop-color="#202b38"/>
      <stop offset="1" stop-color="#2a4150"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#7d8590" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="screenClip">
      <rect x="1014" y="136" width="194" height="104" rx="4"/>
    </clipPath>
  </defs>

  <style>
    .t-name { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #e6edf3; }
    .t-role { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; fill: #22d3ee; letter-spacing: 0.5px; }
    .t-sub  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #8b949e; letter-spacing: 0.4px; }

    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    @keyframes blink { 0%, 52% { opacity: 1; } 53%, 100% { opacity: 0; } }

    .ln    { transform-box: fill-box; }
    .ln-a  { animation: shift-a 6s ease-in-out infinite; }
    .ln-b  { animation: shift-b 6s ease-in-out infinite; }
    .ln-c  { animation: grow 6s ease-in-out infinite; transform-origin: left center; }
    @keyframes shift-a { 0%, 46% { transform: translateX(0); } 58%, 100% { transform: translateX(3px); } }
    @keyframes shift-b { 0%, 42% { transform: translateX(0); } 54%, 100% { transform: translateX(-2.5px); } }
    @keyframes grow { 0%, 10% { transform: scaleX(0.2); } 48%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0.2); } }

    .flicker { animation: flick 6s ease-in-out infinite; }
    @keyframes flick { 0%, 100% { opacity: 0.05; } 34% { opacity: 0.1; } 67% { opacity: 0.03; } }

    .spill { animation: spill 6s ease-in-out infinite; }
    @keyframes spill { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }

    .lamp-breathe { animation: breathe 5.6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.82; } 50% { opacity: 1; } }

    .led { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.9; } }

    .bob { animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.4px); } }

    .steam   { animation: rise 6s ease-in-out infinite; }
    .steam-2 { animation: rise 6s ease-in-out infinite; animation-delay: 2s; }
    @keyframes rise {
      0%   { opacity: 0;    transform: translateY(3px)   scaleX(1); }
      30%  { opacity: 0.45; }
      75%  { opacity: 0.18; transform: translateY(-10px) scaleX(1.25); }
      100% { opacity: 0;    transform: translateY(-16px) scaleX(1.4); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor, .ln-a, .ln-b, .ln-c, .flicker, .spill, .lamp-breathe, .led, .bob, .steam, .steam-2 { animation: none; }
      .ln-c { transform: scaleX(1); }
      .steam, .steam-2 { opacity: 0.28; }
    }
  </style>

  <!-- night backdrop -->
  <rect width="1400" height="380" rx="16" fill="url(#bg)"/>
  <rect width="1400" height="380" rx="16" fill="url(#dots)"/>
  <ellipse cx="1111" cy="196" rx="300" ry="200" fill="url(#screenGlow)"/>
  <ellipse class="lamp-breathe" cx="806" cy="206" rx="158" ry="132" fill="url(#lampGlow)" opacity="0.55"/>

  <!-- left: identity -->
  <g>
    <text class="t-name" x="88" y="158" font-size="54">Gunabhiram Aruru</text>
    <rect x="90" y="180" width="54" height="3" rx="1.5" fill="#f5a524"/>
    <text class="t-role" x="88" y="224" font-size="29">Software Engineer</text>
    <text class="t-sub"  x="88" y="264" font-size="18">Applied AI · Backend Systems · Agent Workflows</text>
  </g>

  <!-- night workspace, seen from behind -->
  <g>
    <!-- shelf -->
    <rect x="1218" y="112" width="128" height="4" rx="2" fill="#7d8590" fill-opacity="0.2"/>
    <rect x="1232" y="88" width="8" height="24" rx="2" fill="#22d3ee" fill-opacity="0.28"/>
    <rect x="1243" y="94" width="8" height="18" rx="2" fill="#7d8590" fill-opacity="0.24"/>
    <rect x="1254" y="84" width="8" height="28" rx="2" fill="#f5a524" fill-opacity="0.24"/>
    <path d="M1286 112 q-14 -4 -16 -16 q14 2 16 16 z" fill="#3fb950" fill-opacity="0.3"/>
    <path d="M1290 112 q10 -8 10 -20 q-11 6 -10 20 z" fill="#3fb950" fill-opacity="0.22"/>
    <path d="M1278 112 h20 l-3 12 h-14 z" fill="#7d8590" fill-opacity="0.3"/>

    <!-- monitor -->
    <g transform="translate(0,32)">
      <rect x="1006" y="128" width="210" height="120" rx="9" fill="#161d26" stroke="#30363d"/>
      <rect x="1014" y="136" width="194" height="104" rx="4" fill="url(#screenFace)"/>
      <g clip-path="url(#screenClip)">
        <rect x="1014" y="136" width="16" height="104" fill="#0a141d"/>
        <rect class="ln ln-a" x="1038" y="150" width="22" height="5" rx="2.5" fill="#a78bfa"/>
        <rect class="ln ln-a" x="1066" y="150" width="54" height="5" rx="2.5" fill="#22d3ee"/>
        <rect class="ln ln-b" x="1046" y="164" width="38" height="5" rx="2.5" fill="#7d8590"/>
        <rect class="ln ln-b" x="1090" y="164" width="62" height="5" rx="2.5" fill="#f5a524" fill-opacity="0.85"/>
        <rect class="ln"      x="1046" y="178" width="28" height="5" rx="2.5" fill="#22d3ee" fill-opacity="0.65"/>
        <rect class="ln"      x="1080" y="178" width="46" height="5" rx="2.5" fill="#7d8590"/>
        <rect class="ln ln-c" x="1054" y="192" width="90" height="5" rx="2.5" fill="#7d8590" fill-opacity="0.9"/>
        <rect class="ln ln-a" x="1038" y="206" width="32" height="5" rx="2.5" fill="#a78bfa" fill-opacity="0.8"/>
        <rect class="cursor"  x="1076" y="205" width="7" height="7" rx="1" fill="#22d3ee"/>
        <rect class="ln ln-b" x="1046" y="220" width="44" height="5" rx="2.5" fill="#7d8590" fill-opacity="0.7"/>
        <rect class="ln"      x="1096" y="220" width="26" height="5" rx="2.5" fill="#22d3ee" fill-opacity="0.45"/>
        <rect x="1030" y="232" width="178" height="8" fill="#08121a"/>
        <rect x="1038" y="234" width="12" height="4" rx="2" fill="#3fb950" fill-opacity="0.7"/>
        <rect x="1056" y="234" width="52" height="4" rx="2" fill="#7d8590" fill-opacity="0.5"/>
        <rect class="flicker" x="1014" y="136" width="194" height="104" fill="#22d3ee"/>
      </g>
      <rect x="1098" y="248" width="26" height="18" fill="#232c37"/>
      <ellipse cx="1111" cy="269" rx="40" ry="6" fill="#232c37"/>
    </g>

    <!-- desk lamp, lit -->
    <g>
      <ellipse cx="762" cy="298" rx="26" ry="7" fill="#232c37"/>
      <path d="M762 296 v-92 q0 -8 8 -12 l30 -14" fill="none" stroke="#2b3542" stroke-width="6" stroke-linecap="round"/>
      <path d="M796 168 l34 14 l-24 26 l-26 -18 z" fill="#2b3542" stroke="#39424f"/>
      <ellipse class="lamp-breathe" cx="800" cy="196" rx="14" ry="6" fill="#f5a524" fill-opacity="0.9"/>
      <path class="lamp-breathe" d="M788 196 L742 302 L906 302 L816 194 z" fill="url(#lampCone)"/>
    </g>

    <!-- desk -->
    <path d="M712 300 h604 q10 0 10 8 v8 q0 8 -10 8 H712 q-10 0 -10 -8 v-8 q0 -8 10 -8 z" fill="url(#deskTop)" stroke="#30363d"/>
    <rect x="746" y="324" width="10" height="40" rx="4" fill="#1b222b"/>
    <rect x="1268" y="324" width="10" height="40" rx="4" fill="#1b222b"/>
    <rect x="702" y="362" width="624" height="3" rx="1.5" fill="#7d8590" fill-opacity="0.1"/>

    <!-- laptop, lid toward us, glow spilling onto the desk -->
    <g>
      <ellipse class="spill" cx="866" cy="300" rx="62" ry="10" fill="#22d3ee" fill-opacity="0.1"/>
      <path d="M818 300 l16 -56 h64 l16 56 z" fill="#1b222b" stroke="#39424f"/>
      <path class="spill" d="M834 246 h62 l2 6 h-66 z" fill="#22d3ee" fill-opacity="0.16"/>
      <circle class="led" cx="866" cy="272" r="4" fill="#22d3ee"/>
    </g>

    <!-- coffee -->
    <g>
      <g class="steam"><path d="M1252 292 q6 -9 0 -18" fill="none" stroke="#c9d1d9" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/></g>
      <g class="steam-2"><path d="M1266 292 q-6 -9 0 -18" fill="none" stroke="#c9d1d9" stroke-width="2.5" stroke-linecap="round" opacity="0.32"/></g>
      <path d="M1284 300 q10 5 0 15" fill="none" stroke="#3a4450" stroke-width="5"/>
      <path d="M1242 296 h42 v14 q0 12 -12 12 h-18 q-12 0 -12 -12 z" fill="#e0b070"/>
      <rect x="1242" y="296" width="42" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.18"/>
    </g>

    <!-- chair -->
    <path d="M948 380 v-72 q0 -26 30 -26 h124 q30 0 30 26 v72 z" fill="#121822"/>

    <!-- developer, back view -->
    <g transform="translate(193.4,61.3) scale(0.85)">
      <g class="bob">
      <path d="M900 372 v-56 q0 -52 54 -66 h84 q54 14 54 66 v56 z" fill="url(#hoodie)"/>
      <path d="M958 258 q38 -16 76 0 q-14 16 -38 16 q-24 0 -38 -16 z" fill="#243441"/>
      <circle cx="996" cy="222" r="33" fill="#222d38"/>
      <path d="M963 224 q0 -35 33 -35 q33 0 33 35 q-8 -14 -33 -14 q-25 0 -33 14 z" fill="#171f29"/>
      <path d="M966 216 q30 -34 60 0" fill="none" stroke="#39424f" stroke-width="5" stroke-linecap="round"/>
      <rect x="957" y="212" width="12" height="22" rx="5" fill="#39424f"/>
      <rect x="1023" y="212" width="12" height="22" rx="5" fill="#39424f"/>
      <circle class="led" cx="1029" cy="223" r="2.2" fill="#22d3ee"/>
      <path d="M1029 210 q10 12 8 30" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
      <path d="M1052 258 q34 16 34 62" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
      <path d="M963 212 q-9 12 -8 28" fill="none" stroke="#f5a524" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
      <path d="M940 258 q-32 16 -32 62" fill="none" stroke="#f5a524" stroke-width="2.5" stroke-linecap="round" opacity="0.22"/>
      </g>
    </g>
  </g>

  <!-- vignette and frame -->
  <rect width="1400" height="380" rx="16" fill="url(#vignette)"/>
  <rect x="0.75" y="0.75" width="1398.5" height="378.5" rx="16" fill="none" stroke="#22d3ee" stroke-opacity="0.16"/>
</svg>
