<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Gunabhiram Aruru — Software Engineer, Applied AI, Agent Systems</title>
  <desc id="heroDesc">Dark engineering control-room panel. On the left, the name Gunabhiram Aruru above three role lines: Software Engineer, Applied AI, Agent Systems, with a status marker reading SYSTEM // ONLINE. On the right, five stacked control panes labelled Evidence, Reasoning, Policy, Review and Action, linked by a signal path, with Policy and Review enclosed inside a dashed control boundary.</desc>

  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F15"/>
      <stop offset="0.55" stop-color="#080B11"/>
      <stop offset="1" stop-color="#06080D"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5A524" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paneFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111823"/>
      <stop offset="1" stop-color="#0C1119"/>
    </linearGradient>
    <linearGradient id="paneFillAction" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E1D24"/>
      <stop offset="1" stop-color="#0C1119"/>
    </linearGradient>
    <pattern id="heroGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#121A24" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes heroFlow { to { stroke-dashoffset: -36; } }
    @keyframes heroRing { 0% { opacity: .5; r: 5; } 100% { opacity: 0; r: 14; } }
    @keyframes heroBreathe { 0%, 100% { opacity: 1; } 50% { opacity: .58; } }
    .flow  { animation: heroFlow 3.2s linear infinite; }
    .ring  { animation: heroRing 3s ease-out infinite; }
    .node  { animation: heroBreathe 4.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .flow, .ring, .node { animation: none; }
    }
  </style>

  <!-- canvas -->
  <rect width="1600" height="620" fill="url(#heroBg)"/>
  <rect width="1600" height="620" fill="url(#heroGrid)" opacity="0.55"/>
  <ellipse cx="1230" cy="300" rx="470" ry="360" fill="url(#heroGlow)"/>
  <ellipse cx="1150" cy="330" rx="240" ry="200" fill="url(#heroGlowAmber)"/>
  <circle cx="1240" cy="312" r="252" fill="none" stroke="#131C27" stroke-width="1"/>
  <circle cx="1240" cy="312" r="186" fill="none" stroke="#111922" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="1599" height="619" rx="18" fill="none" stroke="#1B242F" stroke-width="1"/>

  <!-- identity block -->
  <g>
    <rect x="110" y="150" width="216" height="38" rx="19" fill="#0E141C" stroke="#1E2A36"/>
    <circle class="ring" cx="132" cy="169" r="5" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="132" cy="169" r="4.5" fill="#22D3EE"/>
    <text x="150" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" letter-spacing="2.4" fill="#7DDDEF">SYSTEM // ONLINE</text>

    <text x="110" y="274" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="1.2" fill="#F2F7FB" textLength="800" lengthAdjust="spacingAndGlyphs">GUNABHIRAM ARURU</text>
    <rect x="112" y="304" width="132" height="3" rx="1.5" fill="url(#heroRule)"/>

    <rect x="112" y="360" width="9" height="9" rx="1.5" fill="#22D3EE"/>
    <text x="138" y="369" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" letter-spacing="3" fill="#AFC0D0">SOFTWARE ENGINEER</text>

    <rect x="112" y="402" width="9" height="9" rx="1.5" fill="#F5A524"/>
    <text x="138" y="411" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" letter-spacing="3" fill="#AFC0D0">APPLIED AI</text>

    <rect x="112" y="444" width="9" height="9" rx="1.5" fill="#A78BFA"/>
    <text x="138" y="453" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" letter-spacing="3" fill="#AFC0D0">AGENT SYSTEMS</text>
  </g>

  <!-- control boundary around POLICY + REVIEW -->
  <rect x="1050" y="272" width="392" height="152" rx="14" fill="#F5A524" fill-opacity="0.03" stroke="#F5A524" stroke-opacity="0.34" stroke-width="1" stroke-dasharray="5 7"/>
  <text x="1036" y="348" transform="rotate(-90 1036 348)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2.6" fill="#B98A38">CONTROL BOUNDARY</text>

  <!-- signal path between panes -->
  <g fill="none" stroke-linecap="round">
    <path d="M1060 196 V204 H1078 V212" stroke="#2C4A57" stroke-width="2"/>
    <path d="M1078 268 V276 H1096 V284" stroke="#2C4A57" stroke-width="2"/>
    <path d="M1096 340 V348 H1114 V356" stroke="#2C4A57" stroke-width="2"/>
    <path d="M1114 412 V420 H1132 V428" stroke="#2C4A57" stroke-width="2"/>
    <path class="flow" d="M1060 196 V204 H1078 V212" stroke="#22D3EE" stroke-width="2" stroke-dasharray="5 13" stroke-opacity="0.85"/>
    <path class="flow" d="M1078 268 V276 H1096 V284" stroke="#22D3EE" stroke-width="2" stroke-dasharray="5 13" stroke-opacity="0.85" style="animation-delay:.35s"/>
    <path class="flow" d="M1096 340 V348 H1114 V356" stroke="#F5A524" stroke-width="2" stroke-dasharray="5 13" stroke-opacity="0.85" style="animation-delay:.7s"/>
    <path class="flow" d="M1114 412 V420 H1132 V428" stroke="#F5A524" stroke-width="2" stroke-dasharray="5 13" stroke-opacity="0.85" style="animation-delay:1.05s"/>
  </g>

  <!-- pane 01 EVIDENCE -->
  <g>
    <rect x="1030" y="140" width="340" height="56" rx="10" fill="url(#paneFill)" stroke="#22303D"/>
    <rect x="1031" y="152" width="3.5" height="32" rx="1.75" fill="#A78BFA"/>
    <circle class="node" cx="1060" cy="168" r="4.5" fill="#A78BFA"/>
    <text x="1082" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2.6" fill="#C8D6E4">EVIDENCE</text>
    <text x="1352" y="173" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.4" fill="#4B5B6B">01</text>
  </g>
  <!-- pane 02 REASONING -->
  <g>
    <rect x="1048" y="212" width="340" height="56" rx="10" fill="url(#paneFill)" stroke="#22303D"/>
    <rect x="1049" y="224" width="3.5" height="32" rx="1.75" fill="#22D3EE"/>
    <circle class="node" cx="1078" cy="240" r="4.5" fill="#22D3EE" style="animation-delay:.5s"/>
    <text x="1100" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2.6" fill="#C8D6E4">REASONING</text>
    <text x="1370" y="245" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.4" fill="#4B5B6B">02</text>
  </g>
  <!-- pane 03 POLICY -->
  <g>
    <rect x="1066" y="284" width="340" height="56" rx="10" fill="url(#paneFill)" stroke="#3A3320"/>
    <rect x="1067" y="296" width="3.5" height="32" rx="1.75" fill="#F5A524"/>
    <circle class="node" cx="1096" cy="312" r="4.5" fill="#F5A524" style="animation-delay:1s"/>
    <text x="1118" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2.6" fill="#C8D6E4">POLICY</text>
    <text x="1388" y="317" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.4" fill="#4B5B6B">03</text>
  </g>
  <!-- pane 04 REVIEW -->
  <g>
    <rect x="1084" y="356" width="340" height="56" rx="10" fill="url(#paneFill)" stroke="#3A3320" stroke-dasharray="6 5"/>
    <rect x="1085" y="368" width="3.5" height="32" rx="1.75" fill="#F5A524"/>
    <circle class="node" cx="1114" cy="384" r="4.5" fill="#F5A524" style="animation-delay:1.5s"/>
    <text x="1136" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2.6" fill="#C8D6E4">REVIEW</text>
    <text x="1406" y="389" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.4" fill="#4B5B6B">04</text>
  </g>
  <!-- pane 05 ACTION -->
  <g>
    <rect x="1102" y="428" width="340" height="56" rx="10" fill="url(#paneFillAction)" stroke="#24414B"/>
    <rect x="1103" y="440" width="3.5" height="32" rx="1.75" fill="#22D3EE"/>
    <circle class="node" cx="1132" cy="456" r="4.5" fill="#22D3EE" style="animation-delay:2s"/>
    <text x="1154" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2.6" fill="#DCE8F3">ACTION</text>
    <text x="1424" y="461" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.4" fill="#4B5B6B">05</text>
  </g>
</svg>
