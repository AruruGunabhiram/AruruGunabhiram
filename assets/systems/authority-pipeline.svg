<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" width="1400" height="320" role="img" aria-labelledby="apTitle apDesc">
  <title id="apTitle">Authority pipeline — how model output becomes action</title>
  <desc id="apDesc">Five stages left to right. Stage 01, untrusted input, drawn with a dashed border: model output and retrieved text. Stage 02, grounding: verified against sources. Stage 03, policy: rules, scope and redaction. Stage 04, human review: explicit approval. Stage 05, action: side effect, recorded. Arrows connect each stage to the next.</desc>

  <defs>
    <linearGradient id="apBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F15"/>
      <stop offset="1" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="apChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121A25"/>
      <stop offset="1" stop-color="#0C111A"/>
    </linearGradient>
    <linearGradient id="apChipAction" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2028"/>
      <stop offset="1" stop-color="#0C111A"/>
    </linearGradient>
    <pattern id="apGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#111823" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes apFlow { to { stroke-dashoffset: -28; } }
    .apflow { animation: apFlow 3s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .apflow { animation: none; } }
  </style>

  <rect width="1400" height="320" fill="url(#apBg)"/>
  <rect width="1400" height="320" fill="url(#apGrid)" opacity="0.5"/>
  <rect x="0.5" y="0.5" width="1399" height="319" rx="16" fill="none" stroke="#1B242F"/>

  <rect x="50" y="40" width="8" height="8" rx="1.5" fill="#22D3EE"/>
  <text x="72" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#7D8FA1">AUTHORITY PIPELINE // HOW MODEL OUTPUT BECOMES ACTION</text>

  <!-- connectors -->
  <g fill="none" stroke-linecap="round">
    <path d="M274 172 H316" stroke="#20303B" stroke-width="2"/>
    <path d="M544 172 H586" stroke="#20303B" stroke-width="2"/>
    <path d="M814 172 H856" stroke="#20303B" stroke-width="2"/>
    <path d="M1084 172 H1126" stroke="#20303B" stroke-width="2"/>
    <path class="apflow" d="M274 172 H316" stroke="#A78BFA" stroke-width="2" stroke-dasharray="4 10"/>
    <path class="apflow" d="M544 172 H586" stroke="#22D3EE" stroke-width="2" stroke-dasharray="4 10" style="animation-delay:.3s"/>
    <path class="apflow" d="M814 172 H856" stroke="#F5A524" stroke-width="2" stroke-dasharray="4 10" style="animation-delay:.6s"/>
    <path class="apflow" d="M1084 172 H1126" stroke="#F5A524" stroke-width="2" stroke-dasharray="4 10" style="animation-delay:.9s"/>
    <path d="M310 166 L318 172 L310 178" stroke="#4E6272" stroke-width="2"/>
    <path d="M580 166 L588 172 L580 178" stroke="#4E6272" stroke-width="2"/>
    <path d="M850 166 L858 172 L850 178" stroke="#4E6272" stroke-width="2"/>
    <path d="M1120 166 L1128 172 L1120 178" stroke="#4E6272" stroke-width="2"/>
  </g>

  <!-- 01 UNTRUSTED INPUT -->
  <g>
    <rect x="50" y="120" width="224" height="104" rx="12" fill="url(#apChip)" stroke="#3B3556" stroke-dasharray="7 5"/>
    <rect x="62" y="134" width="26" height="3" rx="1.5" fill="#A78BFA"/>
    <text x="256" y="144" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.6" fill="#4E5D6E">01</text>
    <text x="62" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.8" fill="#CFD9E6">UNTRUSTED</text>
    <text x="62" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.8" fill="#CFD9E6">INPUT</text>
    <text x="162" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#68798B">model output, retrieved text</text>
  </g>
  <!-- 02 GROUNDING -->
  <g>
    <rect x="320" y="120" width="224" height="104" rx="12" fill="url(#apChip)" stroke="#233240"/>
    <rect x="332" y="134" width="26" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="526" y="144" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.6" fill="#4E5D6E">02</text>
    <text x="332" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.8" fill="#CFD9E6">GROUNDING</text>
    <text x="432" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#68798B">checked against sources</text>
  </g>
  <!-- 03 POLICY -->
  <g>
    <rect x="590" y="120" width="224" height="104" rx="12" fill="url(#apChip)" stroke="#3D3521"/>
    <rect x="602" y="134" width="26" height="3" rx="1.5" fill="#F5A524"/>
    <text x="796" y="144" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.6" fill="#4E5D6E">03</text>
    <text x="602" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.8" fill="#CFD9E6">POLICY</text>
    <text x="702" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#68798B">scope, permissions, redaction</text>
  </g>
  <!-- 04 HUMAN REVIEW -->
  <g>
    <rect x="860" y="120" width="224" height="104" rx="12" fill="url(#apChip)" stroke="#3D3521"/>
    <rect x="872" y="134" width="26" height="3" rx="1.5" fill="#F5A524"/>
    <text x="1066" y="144" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.6" fill="#4E5D6E">04</text>
    <text x="872" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.8" fill="#CFD9E6">HUMAN</text>
    <text x="872" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.8" fill="#CFD9E6">REVIEW</text>
    <path d="M1046 186 h20 v18 h-20 z" fill="none" stroke="#F5A524" stroke-width="1.6"/>
    <path d="M1050 186 v-6 a6 6 0 0 1 12 0 v6" fill="none" stroke="#F5A524" stroke-width="1.6"/>
    <text x="972" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#68798B">explicit approval</text>
  </g>
  <!-- 05 ACTION -->
  <g>
    <rect x="1130" y="120" width="220" height="104" rx="12" fill="url(#apChipAction)" stroke="#24434E"/>
    <rect x="1142" y="134" width="26" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="1332" y="144" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.6" fill="#4E5D6E">05</text>
    <text x="1142" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.8" fill="#E2ECF6">ACTION</text>
    <text x="1240" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#68798B">side effect, recorded</text>
  </g>
</svg>
