    <text x="64" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">LOGS</text>
  </g>
  <g>
    <rect x="276" y="160" width="196" height="84" rx="10" fill="url(#incidentpilotChip)" stroke="#233240"/>
    <rect x="290" y="174" width="22" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="458" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">02</text>
    <text x="290" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">SECRET</text>
    <text x="290" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">REDACTION</text>
  </g>
  <g>
    <rect x="502" y="160" width="196" height="84" rx="10" fill="url(#incidentpilotChip)" stroke="#233240"/>
    <rect x="516" y="174" width="22" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="684" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">03</text>
    <text x="516" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">GROUNDED</text>
    <text x="516" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">EVIDENCE</text>
  </g>
  <g>
    <rect x="728" y="160" width="196" height="84" rx="10" fill="url(#incidentpilotChip)" stroke="#233240" stroke-dasharray="7 5"/>
    <rect x="742" y="174" width="22" height="3" rx="1.5" fill="#F5A524"/>
    <text x="910" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">04</text>
    <text x="742" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">SAFETY</text>
    <text x="742" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">GATE</text>
  </g>
  <g>
    <rect x="954" y="160" width="196" height="84" rx="10" fill="url(#incidentpilotLast)" stroke="#24434E"/>
    <rect x="968" y="174" width="22" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="1136" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">05</text>
    <text x="968" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#E2ECF6">APPROVED</text>
    <text x="968" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#E2ECF6">ISSUE</text>
  </g>
  <text x="50" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#68798B">path-confined repository reads · evidence re-read before use · the deterministic report stays authoritative</text>
</svg>
