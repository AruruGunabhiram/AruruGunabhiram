<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="incidentpilotT incidentpilotD">
  <title id="incidentpilotT">INCIDENTPILOT — grounded CI / test-failure investigation</title>
  <desc id="incidentpilotD">IncidentPilot system card. Five stages left to right: failure logs, secret redaction, grounded evidence, safety gate drawn with a dashed gate border, and approved issue. Caption: path-confined repository reads, evidence re-read before use, the deterministic report stays authoritative.</desc>
  <defs>
    <linearGradient id="incidentpilotBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F15"/><stop offset="1" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="incidentpilotChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121A25"/><stop offset="1" stop-color="#0C111A"/>
    </linearGradient>
    <linearGradient id="incidentpilotLast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1D26"/><stop offset="1" stop-color="#0C111A"/>
    </linearGradient>
    <radialGradient id="incidentpilotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.10"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="incidentpilotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#111823" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    @keyframes incidentpilotFlow { to { stroke-dashoffset: -24; } }
    .incidentpilotf { animation: incidentpilotFlow 2.8s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .incidentpilotf { animation: none; } }
  </style>
  <rect width="1200" height="300" fill="url(#incidentpilotBg)"/>
  <rect width="1200" height="300" fill="url(#incidentpilotGrid)" opacity="0.5"/>
  <ellipse cx="180" cy="70" rx="360" ry="180" fill="url(#incidentpilotGlow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#1B242F"/>

  <rect x="50" y="48" width="10" height="10" rx="2" fill="#22D3EE"/>
  <text x="74" y="64" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="1.6" fill="#EFF4F9">INCIDENTPILOT</text>
  <text x="74" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="0.6" fill="#7E8FA0">grounded CI / test-failure investigation</text>
  <text x="1150" y="64" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.4" fill="#5A6B7C">PYTHON · FASTAPI · EVIDENCE PIPELINE</text>
  <path d="M50 118 H1150" stroke="#161F2A" stroke-width="1"/>
  <g fill="none" stroke-linecap="round">
    <path d="M251 202 H270" stroke="#20303B" stroke-width="2"/>
    <path class="incidentpilotf" d="M251 202 H270" stroke="#22D3EE" stroke-width="2" stroke-dasharray="3 9" stroke-opacity="0.9" style="animation-delay:0.00s"/>
    <path d="M264 196 L270 202 L264 208" stroke="#4E6272" stroke-width="1.8" fill="none"/>
    <path d="M477 202 H496" stroke="#20303B" stroke-width="2"/>
    <path class="incidentpilotf" d="M477 202 H496" stroke="#22D3EE" stroke-width="2" stroke-dasharray="3 9" stroke-opacity="0.9" style="animation-delay:0.25s"/>
    <path d="M490 196 L496 202 L490 208" stroke="#4E6272" stroke-width="1.8" fill="none"/>
    <path d="M703 202 H722" stroke="#20303B" stroke-width="2"/>
    <path class="incidentpilotf" d="M703 202 H722" stroke="#22D3EE" stroke-width="2" stroke-dasharray="3 9" stroke-opacity="0.9" style="animation-delay:0.50s"/>
    <path d="M716 196 L722 202 L716 208" stroke="#4E6272" stroke-width="1.8" fill="none"/>
    <path d="M929 202 H948" stroke="#20303B" stroke-width="2"/>
    <path class="incidentpilotf" d="M929 202 H948" stroke="#22D3EE" stroke-width="2" stroke-dasharray="3 9" stroke-opacity="0.9" style="animation-delay:0.75s"/>
    <path d="M942 196 L948 202 L942 208" stroke="#4E6272" stroke-width="1.8" fill="none"/>
  </g>
