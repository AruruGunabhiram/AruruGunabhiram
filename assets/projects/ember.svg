<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="emberT emberD">
  <title id="emberT">EMBER — durable workflow control plane</title>
  <desc id="emberD">Ember system card. Five stages left to right: persistent task state, orchestration with recovery, routing policy, approval and dry-run drawn with a dashed gate border, and scoped adapters. Caption: durable task rows, idempotency and dedupe, every external side effect passes a policy gate.</desc>
  <defs>
    <linearGradient id="emberBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F15"/><stop offset="1" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="emberChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121A25"/><stop offset="1" stop-color="#0C111A"/>
    </linearGradient>
    <linearGradient id="emberLast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1D26"/><stop offset="1" stop-color="#0C111A"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5A524" stop-opacity="0.10"/><stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </radialGradient>
    <pattern id="emberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#111823" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    @keyframes emberFlow { to { stroke-dashoffset: -24; } }
    .emberf { animation: emberFlow 2.8s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .emberf { animation: none; } }
  </style>
  <rect width="1200" height="300" fill="url(#emberBg)"/>
  <rect width="1200" height="300" fill="url(#emberGrid)" opacity="0.5"/>
  <ellipse cx="180" cy="70" rx="360" ry="180" fill="url(#emberGlow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#1B242F"/>

  <rect x="50" y="48" width="10" height="10" rx="2" fill="#F5A524"/>
  <text x="74" y="64" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="1.6" fill="#EFF4F9">EMBER</text>
  <text x="74" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="0.6" fill="#7E8FA0">durable workflow control plane</text>
  <text x="1150" y="64" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.4" fill="#5A6B7C">PYTHON · FASTAPI · SQLITE · ALEMBIC</text>
  <path d="M50 118 H1150" stroke="#161F2A" stroke-width="1"/>
  <g fill="none" stroke-linecap="round">
    <path d="M251 202 H270" stroke="#20303B" stroke-width="2"/>
    <path class="emberf" d="M251 202 H270" stroke="#F5A524" stroke-width="2" stroke-dasharray="3 9" stroke-opacity="0.9" style="animation-delay:0.00s"/>
    <path d="M264 196 L270 202 L264 208" stroke="#4E6272" stroke-width="1.8" fill="none"/>
    <path d="M477 202 H496" stroke="#20303B" stroke-width="2"/>
    <path class="emberf" d="M477 202 H496" stroke="#F5A524" stroke-width="2" stroke-dasharray="3 9" stroke-opacity="0.9" style="animation-delay:0.25s"/>
    <path d="M490 196 L496 202 L490 208" stroke="#4E6272" stroke-width="1.8" fill="none"/>
    <path d="M703 202 H722" stroke="#20303B" stroke-width="2"/>
    <path class="emberf" d="M703 202 H722" stroke="#F5A524" stroke-width="2" stroke-dasharray="3 9" stroke-opacity="0.9" style="animation-delay:0.50s"/>
    <path d="M716 196 L722 202 L716 208" stroke="#4E6272" stroke-width="1.8" fill="none"/>
    <path d="M929 202 H948" stroke="#20303B" stroke-width="2"/>
    <path class="emberf" d="M929 202 H948" stroke="#F5A524" stroke-width="2" stroke-dasharray="3 9" stroke-opacity="0.9" style="animation-delay:0.75s"/>
    <path d="M942 196 L948 202 L942 208" stroke="#4E6272" stroke-width="1.8" fill="none"/>
  </g>
  <g>
    <rect x="50" y="160" width="196" height="84" rx="10" fill="url(#emberChip)" stroke="#233240"/>
    <rect x="64" y="174" width="22" height="3" rx="1.5" fill="#F5A524"/>
    <text x="232" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">01</text>
    <text x="64" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">PERSISTENT</text>
    <text x="64" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">TASK STATE</text>
  </g>
  <g>
    <rect x="276" y="160" width="196" height="84" rx="10" fill="url(#emberChip)" stroke="#233240"/>
    <rect x="290" y="174" width="22" height="3" rx="1.5" fill="#F5A524"/>
    <text x="458" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">02</text>
    <text x="290" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">ORCHESTRATION</text>
    <text x="290" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">+ RECOVERY</text>
  </g>
  <g>
    <rect x="502" y="160" width="196" height="84" rx="10" fill="url(#emberChip)" stroke="#233240"/>
    <rect x="516" y="174" width="22" height="3" rx="1.5" fill="#F5A524"/>
    <text x="684" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">03</text>
    <text x="516" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">ROUTING</text>
    <text x="516" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">POLICY</text>
  </g>
  <g>
    <rect x="728" y="160" width="196" height="84" rx="10" fill="url(#emberChip)" stroke="#3D3521" stroke-dasharray="7 5"/>
    <rect x="742" y="174" width="22" height="3" rx="1.5" fill="#F5A524"/>
    <text x="910" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">04</text>
    <text x="742" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">APPROVAL</text>
    <text x="742" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">DRY-RUN</text>
  </g>
  <g>
    <rect x="954" y="160" width="196" height="84" rx="10" fill="url(#emberLast)" stroke="#24434E"/>
    <rect x="968" y="174" width="22" height="3" rx="1.5" fill="#F5A524"/>
    <text x="1136" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">05</text>
    <text x="968" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#E2ECF6">SCOPED</text>
    <text x="968" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#E2ECF6">ADAPTERS</text>
  </g>
  <text x="50" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#68798B">durable task rows · idempotency and dedupe · every external side effect passes a policy gate</text>
</svg>
