<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="orkafinT orkafinD">
  <title id="orkafinT">ORKAFIN — permission-aware recruiting guidance</title>
  <desc id="orkafinD">OrkaFin system card. Five stages left to right: request with identity, trusted context, permission boundary, grounding check drawn with a dashed gate border, and confirmed action. Caption: deterministic retrieval, field-level redaction, actions revalidated at the moment of confirmation.</desc>
  <defs>
    <linearGradient id="orkafinBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F15"/><stop offset="1" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="orkafinChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121A25"/><stop offset="1" stop-color="#0C111A"/>
    </linearGradient>
    <linearGradient id="orkafinLast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1D26"/><stop offset="1" stop-color="#0C111A"/>
    </linearGradient>
    <radialGradient id="orkafinGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.10"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="orkafinGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#111823" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    @keyframes orkafinFlow { to { stroke-dashoffset: -24; } }
    .orkafinf { animation: orkafinFlow 2.8s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .orkafinf { animation: none; } }
  </style>
  <rect width="1200" height="300" fill="url(#orkafinBg)"/>
  <rect width="1200" height="300" fill="url(#orkafinGrid)" opacity="0.5"/>
  <ellipse cx="180" cy="70" rx="360" ry="180" fill="url(#orkafinGlow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#1B242F"/>

  <rect x="50" y="48" width="10" height="10" rx="2" fill="#A78BFA"/>
  <text x="74" y="64" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="1.6" fill="#EFF4F9">ORKAFIN</text>
  <text x="74" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="0.6" fill="#7E8FA0">permission-aware recruiting guidance</text>
  <text x="1150" y="64" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.4" fill="#5A6B7C">PYTHON · FASTAPI · SQLITE · ACCESS CONTROL</text>
  <path d="M50 118 H1150" stroke="#161F2A" stroke-width="1"/>
  <g fill="none" stroke-linecap="round">
    <path d="M251 202 H270" stroke="#20303B" stroke-width="2"/>
    <path class="orkafinf" d="M251 202 H270" stroke="#A78BFA" stroke-width="2" stroke-dasharray="3 9" stroke-opacity="0.9" style="animation-delay:0.00s"/>
    <path d="M264 196 L270 202 L264 208" stroke="#4E6272" stroke-width="1.8" fill="none"/>
    <path d="M477 202 H496" stroke="#20303B" stroke-width="2"/>
    <path class="orkafinf" d="M477 202 H496" stroke="#A78BFA" stroke-width="2" stroke-dasharray="3 9" stroke-opacity="0.9" style="animation-delay:0.25s"/>
    <path d="M490 196 L496 202 L490 208" stroke="#4E6272" stroke-width="1.8" fill="none"/>
    <path d="M703 202 H722" stroke="#20303B" stroke-width="2"/>
    <path class="orkafinf" d="M703 202 H722" stroke="#A78BFA" stroke-width="2" stroke-dasharray="3 9" stroke-opacity="0.9" style="animation-delay:0.50s"/>
    <path d="M716 196 L722 202 L716 208" stroke="#4E6272" stroke-width="1.8" fill="none"/>
    <path d="M929 202 H948" stroke="#20303B" stroke-width="2"/>
    <path class="orkafinf" d="M929 202 H948" stroke="#A78BFA" stroke-width="2" stroke-dasharray="3 9" stroke-opacity="0.9" style="animation-delay:0.75s"/>
    <path d="M942 196 L948 202 L942 208" stroke="#4E6272" stroke-width="1.8" fill="none"/>
  </g>
  <g>
    <rect x="50" y="160" width="196" height="84" rx="10" fill="url(#orkafinChip)" stroke="#233240"/>
    <rect x="64" y="174" width="22" height="3" rx="1.5" fill="#A78BFA"/>
    <text x="232" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">01</text>
    <text x="64" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">REQUEST</text>
    <text x="64" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">+ IDENTITY</text>
  </g>
  <g>
    <rect x="276" y="160" width="196" height="84" rx="10" fill="url(#orkafinChip)" stroke="#233240"/>
    <rect x="290" y="174" width="22" height="3" rx="1.5" fill="#A78BFA"/>
    <text x="458" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">02</text>
    <text x="290" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">TRUSTED</text>
    <text x="290" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">CONTEXT</text>
  </g>
  <g>
    <rect x="502" y="160" width="196" height="84" rx="10" fill="url(#orkafinChip)" stroke="#233240"/>
    <rect x="516" y="174" width="22" height="3" rx="1.5" fill="#A78BFA"/>
    <text x="684" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">03</text>
    <text x="516" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">PERMISSION</text>
    <text x="516" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">BOUNDARY</text>
  </g>
  <g>
    <rect x="728" y="160" width="196" height="84" rx="10" fill="url(#orkafinChip)" stroke="#3B3556" stroke-dasharray="7 5"/>
    <rect x="742" y="174" width="22" height="3" rx="1.5" fill="#F5A524"/>
    <text x="910" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">04</text>
    <text x="742" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">GROUNDING</text>
    <text x="742" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#CBD8E5">CHECK</text>
  </g>
  <g>
    <rect x="954" y="160" width="196" height="84" rx="10" fill="url(#orkafinLast)" stroke="#24434E"/>
    <rect x="968" y="174" width="22" height="3" rx="1.5" fill="#A78BFA"/>
    <text x="1136" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4E5D6E">05</text>
    <text x="968" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#E2ECF6">CONFIRMED</text>
    <text x="968" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" letter-spacing="1.4" fill="#E2ECF6">ACTION</text>
  </g>
  <text x="50" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#68798B">deterministic retrieval · field-level redaction · actions revalidated at the moment of confirmation</text>
</svg>
